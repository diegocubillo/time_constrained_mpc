# Nav2 Parameters for MPC Controller Integration
# This file contains all necessary parameters for running Nav2 loopback simulator with the MPC controller

# map_server:
#   ros__parameters:
#     use_sim_time: false
#     yaml_filename: ""  # Will be set in launch file

lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ['mpc_controller']

# Loopback simulator parameters
loopback_simulator:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    map_frame_id: "map"
    scan_frame_id: "base_scan"
    enable_stamped_cmd_vel: false
    publish_map_odom_tf: true
    update_duration: 0.01
