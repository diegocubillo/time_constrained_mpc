mpc_controller:
  ros__parameters:
    # # MPC Configuration
    # controller_frequency: 10.0  # Hz
    prediction_horizon_steps: 20  # detailed prediction
    control_horizon_steps: 10     # optimization steps (reduce this < prediction for speed)
    
    # # Command Velocity Message Type
    # use_stamped_cmd_vel: false   # true: TwistStamped, false: Twist
    
    # Velocity Limits
    max_linear_vel: 0.5         # m/s
    max_angular_vel: 1.5        # rad/s (increased for sharper turns)
    max_linear_accel: 0.5       # m/s² (increased for quicker linear response)
    max_angular_accel: 3.0      # rad/s² (increased for quicker angular response)
    
    # # Goal Tolerances
    goal_dist_tolerance: 0.1    # meters
    goal_theta_tolerance: 0.15   # radians (approx 8.6 degrees)
    
    # Path Smoothing
    path_smoothing_window: 0.5  # meters - smooths sharp corners

    # Enable MPC Debugging Output
    # debug_mpc: true
    
    # Bond Settings
    use_bond: true
    
    # MPC Cost Weights
    # State tracking weights [x, y, sin(theta), cos(theta)]
    # High position weights to prioritize getting close to path
    # Low angular weights - orientation is flexible, only position matters
    Q_matrix_diag: [3000.0, 3000.0, 5.0, 5.0]
    
    # Control rate weights (change/acceleration) [dv, domega]
    # Moderate smoothness - allow angular changes for tight turns
    R_d_matrix_diag: [50.0, 50.0]
    
    # Frame IDs
    # map_frame: "map"
    # base_frame: "base_link"
    # odom_topic: "odom"
