mpc_controller:
  ros__parameters:
    # MPC Configuration
    controller_frequency: 10.0  # Hz
    horizon_sec: 2.0            # seconds
    horizon_steps: 10           # prediction steps
    
    # Command Velocity Message Type
    use_stamped_cmd_vel: false   # true: TwistStamped, false: Twist
    
    # Velocity Limits
    max_linear_vel: 0.5         # m/s
    max_angular_vel: 1.5        # rad/s (increased for sharper turns)
    max_linear_accel: 0.5       # m/s² (increased for quicker linear response)
    max_angular_accel: 3.0      # rad/s² (increased for quicker angular response)
    
    # Lookahead Configuration
    # REDUCE lookahead to track closer points
    lookahead_time: 1.5         # seconds
    min_lookahead_dist: 0.2     # meters
    max_lookahead_dist: 1.5     # meters
    
    # Goal Tolerances
    goal_dist_tolerance: 0.2    # meters
    goal_theta_tolerance: 0.1   # radians
    
    # Path Smoothing
    path_smoothing_window: 0.0  # meters - smooths sharp corners
    
    # MPC Cost Weights
    # State tracking weights [x, y, sin(theta), cos(theta)]
    # High position weights to prioritize getting close to path
    # Low angular weights - orientation is flexible, only position matters
    Q_matrix_diag: [3000.0, 3000.0, 5.0, 5.0]
    
    # Control effort weights [v, omega]
    # NOTE: R_matrix is currently NOT USED (Option 2: only smooth movements)
    # Only R_d_matrix (rate of change) is penalized for smoothness
    # R_matrix_diag: [1.0, 1.0]
    
    # Control rate weights (change/acceleration) [dv, domega]
    # Moderate smoothness - allow angular changes for tight turns
    R_d_matrix_diag: [50.0, 50.0]
    
    # Frame IDs
    map_frame: "map"
    base_frame: "base_link"
    odom_frame: "odom"
